[package]
name = "ethgas"
version = "0.1.0"
edition = "2024"

[dependencies]
alloy = { version = "0.12.5", features = ["eip712"] }
anyhow = "1.0.97"
clap = { version = "4.5.40", features = ["derive", "env"] }
dotenvy = "0.15.7"
futures-util = "0.3.30"
rand = "0.8.5"
reqwest = "0.12.14"
serde = "1.0.219"
serde_json = "1.0.140"
tokio = { version = "1.44.1", features = ["rt-multi-thread", "macros"] }
tokio-tungstenite = { version = "0.21.0", features = ["native-tls"] }
url = "2.5.4"
uuid = { version = "1.16.0", features = ["v4"] }
